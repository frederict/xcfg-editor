      Aucune ressource de cette page ne vient d'un autre hôte. C'était faux jusqu'au
      22 août 2026 : deux `<link>` vers `fonts.googleapis.com` et `fonts.gstatic.com`
      faisaient annoncer la visite du pilote à un tiers — IP et `Referer` — avant même
      qu'il ait déposé un fichier, pendant que le README promettait dans cinq langues une
      page « sans serveur à qui parler ».

      Les deux familles du carnet, Spectral pour les titres et Public Sans pour le corps,
      sont désormais servies par le dépôt lui-même : `src/ui/fonts.css` porte les
      `@font-face`, `src/ui/fonts/` les treize `woff2`, et `app.css` les appelle. 146 Ko,
      une fois, et la promesse redevient littérale.

      ⚠️ Ne pas rouvrir cette porte. Une fonte, une icône, une mesure d'audience prises
      chez un tiers valent la même chose : le pilote parle à quelqu'un qu'il n'a pas
      choisi. `tests/ui/appStyle.test.ts` refuse toute URL absolue dans la feuille et dans
      cette page — c'est le garde-fou, pas cette phrase.
    -->
