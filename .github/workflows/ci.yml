# Contrôle et publication.
#
# Un seul fichier, deux tâches : `verifier` passe partout, `publier` ne s'exécute que sur
# la branche par défaut et seulement si `verifier` est vert. Une page publiée qui ne
# compile pas serait pire qu'une page absente.
#
# ## Pourquoi les actions sont épinglées à une empreinte de commit
#
# `actions/checkout@v7` désigne une **étiquette mobile** : le propriétaire du dépôt peut
# la déplacer sur n'importe quel commit, à tout moment, sans que rien ne change ici. Un
# workflow qui a le droit de publier sur GitHub Pages exécuterait alors du code que
# personne n'a relu. L'empreinte, elle, ne bouge pas. La version lisible reste en
# commentaire, pour savoir ce qu'on met à jour le jour où on le fait.
#
# ## Pourquoi cette CI est verte sur une machine qui n'a rien
#
# Toute la suite lit un corpus versionné (`tests/fixtures/`). Aucun fichier du poste de
# l'auteur, aucun secret, aucun service : `npm ci` puis les trois commandes.

name: Contrôle et publication

on:
  push:
  pull_request:
  # Permet de republier sans avoir à pousser un commit vide.
  workflow_dispatch:

# Au plus bas par défaut : cloner, rien d'autre. Les droits d'écriture sur Pages sont
# accordés au seul travail qui publie, pas à celui qui exécute les tests — un travail qui
# lance du code de dépendance n'a aucune raison de pouvoir déployer.
permissions:
  contents: read

# Une publication à la fois. `cancel-in-progress: false` parce qu'interrompre un
# déploiement à mi-course laisserait le site dans un état indéterminé — on préfère
# attendre la fin du précédent.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verifier:
    name: Types, tests, construction
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Vite 8 et Vitest 4 exigent Node 22.12 ou plus récent.
          node-version: '22'
          cache: npm

      # `npm ci` et non `npm install` : il installe exactement ce que décrit
      # package-lock.json et échoue si le verrou et le manifeste divergent.
      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      - name: Exécuter la suite de tests
        run: npm test

      - name: Construire le site
        run: npm run build

      # `base: './'` dans vite.config.ts rend l'artefact indépendant du sous-chemin :
      # il fonctionne sous https://<compte>.github.io/<dépôt>/ comme ailleurs.
      - name: Préparer l’artefact Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  publier:
    name: Publier sur GitHub Pages
    # Seulement depuis la branche par défaut : une branche de travail se vérifie, elle
    # ne se publie pas.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: verifier
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Configurer Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Déployer
        id: deploiement
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
